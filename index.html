<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app {
      width: 100%; max-width: 1000px; height: 92vh;
      display: flex; border-radius: 16px; overflow: hidden;
      box-shadow: 0 4px 30px rgba(0,0,0,0.12);
    }
    .sidebar {
      width: 240px; min-width: 240px;
      background: #1e2330;
      display: flex; flex-direction: column; color: #fff;
    }
    .sidebar-header {
      padding: 18px 14px 12px;
      border-bottom: 1px solid #2e3347;
    }
    .sidebar-header h2 {
      font-size: 14px; font-weight: 600;
      color: #e0e6f0; margin-bottom: 10px;
    }
    #new-chat-btn {
      width: 100%; background: #1a73e8; color: #fff;
      border: none; border-radius: 8px; padding: 9px 0;
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: background 0.15s;
    }
    #new-chat-btn:hover { background: #1558c0; }
    .sidebar-list {
      flex: 1; overflow-y: auto; padding: 8px;
      scrollbar-width: thin; scrollbar-color: #3a3f55 transparent;
    }
    .chat-item {
      padding: 9px 11px; border-radius: 8px; cursor: pointer;
      margin-bottom: 2px; transition: background 0.12s;
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 6px;
      border: 1px solid transparent;
    }
    .chat-item:hover  { background: #2a2f42; }
    .chat-item.active { background: rgba(26,115,232,0.15); border-color: rgba(26,115,232,0.3); }
    .chat-item-info   { flex: 1; overflow: hidden; }
    .chat-item-title {
      font-size: 13px; color: #c8d0e0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chat-item.active .chat-item-title { color: #fff; }
    .chat-item-date { font-size: 10px; color: #555e7a; margin-top: 2px; }
    .delete-btn {
      background: none; border: none; color: #555e7a;
      cursor: pointer; font-size: 14px; padding: 0 2px;
      display: none; line-height: 1; flex-shrink: 0;
      transition: color 0.1s;
    }
    .chat-item:hover .delete-btn { display: block; }
    .delete-btn:hover { color: #e05555; }
    .empty-list {
      padding: 20px 10px; text-align: center;
      font-size: 12px; color: #555e7a; line-height: 1.6;
    }
    .main { flex: 1; display: flex; flex-direction: column; background: #fff; overflow: hidden; }
    .header {
      background: #1a73e8; color: #fff;
      padding: 14px 20px; display: flex;
      align-items: center; flex-shrink: 0;
    }
    .header h1   { font-size: 16px; font-weight: 600; }
    .header span { font-size: 11px; opacity: 0.75; display: block; margin-top: 2px; }
    #messages {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
      background: #f8f9fb;
      scrollbar-width: thin; scrollbar-color: #ddd transparent;
    }
    #welcome {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      flex: 1; text-align: center; color: #999; gap: 10px;
    }
    #welcome h2 { font-size: 20px; font-weight: 600; color: #333; }
    #welcome p  { font-size: 14px; line-height: 1.6; max-width: 320px; }
    .message {
      display: flex; gap: 10px; align-items: flex-start;
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message.user { flex-direction: row-reverse; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .avatar.ai   { background: #1a73e8; color: #fff; }
    .avatar.user { background: #e8f0fe; color: #1a73e8; }
    .bubble {
      max-width: 70%; padding: 10px 14px;
      border-radius: 16px; font-size: 14px; line-height: 1.65;
    }
    .message.user .bubble {
      background: #1a73e8; color: #fff; border-top-right-radius: 4px;
    }
    .message.ai .bubble {
      background: #fff; color: #222;
      border: 1px solid #e0e0e0; border-top-left-radius: 4px;
    }
    .bubble code {
      background: #f1f3f4; color: #c0392b;
      font-family: 'Courier New', monospace;
      font-size: 12.5px; padding: 1px 5px; border-radius: 4px;
    }
    .bubble pre {
      background: #f1f3f4; border-radius: 8px; padding: 12px;
      margin-top: 8px; overflow-x: auto;
      font-family: 'Courier New', monospace;
      font-size: 12.5px; line-height: 1.5;
    }
    .bubble pre code { background: none; padding: 0; color: inherit; }
    .msg-time { font-size: 10px; color: #aaa; margin-top: 4px; padding: 0 4px; }
    .message.user .msg-time { text-align: right; }
    .cursor { animation: blink 0.7s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .error-msg {
      background: #fdecea; border: 1px solid #f5c6c6;
      color: #c0392b; border-radius: 10px;
      padding: 10px 14px; font-size: 13px;
    }
    .input-area {
      padding: 12px 16px; border-top: 1px solid #e8e8e8;
      background: #fff; display: flex; gap: 10px;
      align-items: flex-end; flex-shrink: 0;
    }
    #message-input {
      flex: 1; border: 1.5px solid #d0d5dd; border-radius: 10px;
      padding: 10px 14px;
      font-family: 'Segoe UI', sans-serif; font-size: 14px;
      resize: none; outline: none;
      max-height: 130px; line-height: 1.5;
      transition: border-color 0.15s;
    }
    #message-input:focus { border-color: #1a73e8; }
    #message-input::placeholder { color: #aaa; }
    #send-btn {
      width: 40px; height: 40px; background: #1a73e8;
      border: none; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.15s, transform 0.1s;
    }
    #send-btn:hover   { background: #1558c0; }
    #send-btn:active  { transform: scale(0.95); }
    #send-btn:disabled { background: #ccc; cursor: not-allowed; }
    #send-btn svg {
      width: 17px; height: 17px; fill: none; stroke: #fff;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    }
    .input-hint {
      font-size: 11px; color: #bbb; text-align: right;
      padding: 4px 16px 8px; background: #fff;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Conversations</h2>
      <button id="new-chat-btn" onclick="newChat()">+ New Chat</button>
    </div>
    <div class="sidebar-list" id="chat-list">
      <div class="empty-list">No chats yet.<br>Start a new conversation!</div>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <div>
        <h1>AI Assistant</h1>
        <span id="chat-label">New conversation</span>
      </div>
    </div>
    <div id="messages">
      <div id="welcome">
        <h2>Hello! How can I help?</h2>
        <p>Type a message below or pick a conversation from the sidebar.</p>
      </div>
    </div>
    <div class="input-area">
      <textarea id="message-input" rows="1"
        placeholder="Type your message..."
        oninput="autoResize(this)"
        onkeydown="handleKey(event)"></textarea>
      <button id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">Enter to send &nbsp;· &nbsp;Shift+Enter for new line</div>
  </div>
</div>

<script>
  const API = 'http://localhost:8000';
  let currentChatId = null;
  let isBusy = false;

  async function loadSidebar() {
    try {
      const res  = await fetch(`${API}/chats`);
      const list = await res.json();
      renderSidebar(list);
    } catch { /* server not ready */ }
  }

  function renderSidebar(list) {
    const el = document.getElementById('chat-list');
    if (!list.length) {
      el.innerHTML = '<div class="empty-list">No chats yet.<br>Start a new conversation!</div>';
      return;
    }
    list.sort((a, b) => b.created_at.localeCompare(a.created_at));
    el.innerHTML = list.map(c => `
      <div class="chat-item ${c.id === currentChatId ? 'active' : ''}"
           id="item-${c.id}" onclick="openChat('${c.id}')">
        <div class="chat-item-info">
          <div class="chat-item-title">${escHtml(c.title)}</div>
          <div class="chat-item-date">${formatDate(c.created_at)}</div>
        </div>
        <button class="delete-btn" onclick="deleteChat(event,'${c.id}')">x</button>
      </div>
    `).join('');
  }

  async function openChat(id) {
    try {
      const res  = await fetch(`${API}/chats/${id}`);
      const chat = await res.json();
      currentChatId = id;
      document.getElementById('chat-label').textContent = chat.title;
      const msgs = document.getElementById('messages');
      msgs.innerHTML = '';
      if (!chat.messages.length) {
        msgs.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;flex:1;text-align:center;color:#999;padding:40px"><p>Empty chat — send a message!</p></div>';
      } else {
        chat.messages.forEach(m => addBubble(m.role, m.content, m.time));
      }
      document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
      const item = document.getElementById('item-' + id);
      if (item) item.classList.add('active');
      scrollDown();
    } catch { showError('Could not load chat.'); }
  }

  async function deleteChat(e, id) {
    e.stopPropagation();
    await fetch(`${API}/chats/${id}`, { method: 'DELETE' });
    if (currentChatId === id) newChat();
    loadSidebar();
  }

  function newChat() {
    currentChatId = null;
    document.getElementById('chat-label').textContent = 'New conversation';
    document.getElementById('messages').innerHTML = `
      <div id="welcome">
        <h2>Hello! How can I help?</h2>
        <p>Type a message below or pick a conversation from the sidebar.</p>
      </div>`;
    document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
    document.getElementById('message-input').focus();
  }

  async function sendMessage() {
    if (isBusy) return;
    const input = document.getElementById('message-input');
    const text  = input.value.trim();
    if (!text) return;

    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    addBubble('user', text);
    input.value = '';
    autoResize(input);

    const aiBubble = createEmptyAiBubble();
    isBusy = true;
    document.getElementById('send-btn').disabled = true;

    try {
      const res = await fetch(`${API}/chat/stream`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: currentChatId, message: text })
      });

      if (!res.ok) { aiBubble.innerHTML = 'Server error ' + res.status; return; }

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let rawText   = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const lines = decoder.decode(value).split('\n').filter(l => l.startsWith('data: '));
        for (const line of lines) {
          const data = line.slice(6);
          if (data === '[DONE]') { await loadSidebar(); break; }
          if (data.startsWith('[CHAT_ID:')) {
            currentChatId = data.slice(9, -1);
            document.getElementById('chat-label').textContent =
              text.slice(0, 40) + (text.length > 40 ? '...' : '');
            continue;
          }
          rawText += data;
          aiBubble.innerHTML = formatText(rawText) + '<span class="cursor">|</span>';
          scrollDown();
        }
      }
      aiBubble.innerHTML = formatText(rawText);

    } catch {
      aiBubble.innerHTML = 'Cannot reach server. Is uvicorn running?';
    } finally {
      isBusy = false;
      document.getElementById('send-btn').disabled = false;
      input.focus();
      scrollDown();
    }
  }

  function createEmptyAiBubble() {
    const msgs = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = 'message ai';
    wrap.innerHTML = `
      <div class="avatar ai">AI</div>
      <div>
        <div class="bubble"><div class="bubble-content"></div></div>
        <div class="msg-time">${now()}</div>
      </div>`;
    msgs.appendChild(wrap);
    scrollDown();
    return wrap.querySelector('.bubble-content');
  }

  function addBubble(role, text, time) {
    const msgs = document.getElementById('messages');
    const wrap = document.createElement('div');
    const isAi = role === 'assistant';
    wrap.className = `message ${isAi ? 'ai' : 'user'}`;
    wrap.innerHTML = `
      <div class="avatar ${isAi ? 'ai' : 'user'}">${isAi ? 'AI' : 'You'}</div>
      <div>
        <div class="bubble">${formatText(text)}</div>
        <div class="msg-time">${time ? fmtTime(time) : now()}</div>
      </div>`;
    msgs.appendChild(wrap);
  }

  function showError(msg) {
    const msgs = document.getElementById('messages');
    const div  = document.createElement('div');
    div.className = 'error-msg';
    div.textContent = msg;
    msgs.appendChild(div);
    scrollDown();
  }

  function formatText(text) {
    let h = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    h = h.replace(/```[\w]*\n?([\s\S]*?)```/g, (_,c) => `<pre><code>${c.trim()}</code></pre>`);
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/\n/g, '<br>');
    return h;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function scrollDown() {
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 130) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function fmtTime(iso) {
    try { return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
    catch { return ''; }
  }

  function formatDate(iso) {
    try {
      const d = new Date(iso);
      const today = new Date();
      if (d.toDateString() === today.toDateString()) return 'Today';
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    } catch { return ''; }
  }

  loadSidebar();
</script>
</body>
</html>
